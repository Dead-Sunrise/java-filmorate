name: Build and Deploy for Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  deploy-for-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build application
        run: mvn -B clean package -DskipTests

      - name: Deploy and keep running
        run: |
          curl -o /tmp/wait-for-it.sh https://raw.githubusercontent.com/vishnubob/wait-for-it/master/wait-for-it.sh
          chmod +x /tmp/wait-for-it.sh
          
          echo "Starting application..."
          java -jar target/filmorate-0.0.1-SNAPSHOT.jar &
          
          echo "Waiting for application to start on port 8080..."
          /tmp/wait-for-it.sh -t 120 localhost:8080
          
          echo "Application status:"
          curl -s http://localhost:8080/actuator/health || curl -s http://localhost:8080 || echo "Endpoint check failed but port is open"
          
          echo "Application is running and ready for API tests"
          while true; do
            sleep 60
            echo "Still running..."
          done